# Collision TwoRoom + contact 라벨. data/collision_tworoom.yaml과 같고 contact_next를 더 읽는다.
# gate_objective=supervised 전용이다. 원본 collision_tworoom.h5는 그대로 두고, 사본에 라벨을 넣는다:
#   cp $STABLEWM_HOME/datasets/collision_tworoom.h5 $STABLEWM_HOME/datasets/collision_tworoom_contact.h5
#   python scripts/add_contact_labels.py --data collision_tworoom_contact.h5
# train.py가 이 열도 z-score 정규화하므로, gate 블록은 0보다 큰 값을 1로 본다.
dataset:
  num_steps: 4      # history_size + num_preds
  frameskip: 5
  name: collision_tworoom_contact.h5
  keys_to_load:
    - pixels
    - action
    - proprio
    - contact_next
  keys_to_cache:
    - action
    - proprio
